name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails the build on any high or critical advisory in the full
      # dependency tree (prod + dev). Moderate/low are reported but don't fail.
      - name: Dependency audit (high/critical)
        run: npm audit --audit-level=high

      - name: Build and test
        run: npm test
